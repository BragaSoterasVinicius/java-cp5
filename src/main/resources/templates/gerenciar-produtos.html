
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Produtos | CP5 E-commerce</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/gerenciar-produtos.js}" defer></script>
</head>
<body>

<header>
    <a th:href="@{/}" class="header-brand">CP5 E-commerce</a>

    <nav>
        <a th:href="@{/produtos}">Catálogo</a>
        <a th:href="@{/}">Home</a>
    </nav>
</header>

<main class="management-container">

    <section class="management-heading">
        <div>
            <h1>Gerenciar produtos</h1>
            <p>Cadastre, consulte, atualize e exclua produtos.</p>
        </div>

        <button type="button" id="newProductButton" class="button">
            Novo produto
        </button>
    </section>

    <section id="productFormSection" class="management-card">
        <h2 id="formTitle">Cadastrar produto</h2>

        <form id="productForm">
            <input type="hidden" id="productId">

            <div class="management-form-grid">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input
                            type="text"
                            id="nome"
                            maxlength="150"
                            required
                            placeholder="Nome do produto">
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$) *</label>
                    <input
                            type="number"
                            id="preco"
                            min="0"
                            step="0.01"
                            required
                            placeholder="99.90">
                </div>

                <div class="form-group">
                    <label for="estoque">Estoque *</label>
                    <input
                            type="number"
                            id="estoque"
                            min="0"
                            step="1"
                            required
                            value="0">
                </div>

                <div class="form-group">
                    <label for="categoriaId">ID da categoria</label>
                    <input
                            type="number"
                            id="categoriaId"
                            min="1"
                            step="1"
                            placeholder="ID da categoria">
                </div>

                <div class="form-group">
                    <label for="ativo">Status</label>
                    <select id="ativo">
                        <option value="S">Ativo</option>
                        <option value="N">Inativo</option>
                    </select>
                </div>

                <div class="form-group description-group">
                    <label for="descricao">Descrição</label>
                    <textarea
                            id="descricao"
                            rows="4"
                            placeholder="Descrição do produto"></textarea>
                </div>
            </div>

            <p id="formMessage" role="alert" class="error-message"></p>

            <div class="management-actions">
                <button type="submit" id="saveProductButton" class="button">
                    Cadastrar produto
                </button>

                <button
                        type="button"
                        id="cancelEditButton"
                        class="secondary-button"
                        hidden>
                    Cancelar edição
                </button>
            </div>
        </form>
    </section>

    <section class="management-card">
        <div class="table-heading">
            <h2>Produtos cadastrados</h2>

            <button
                    type="button"
                    id="reloadProductsButton"
                    class="secondary-button">
                Atualizar lista
            </button>
        </div>

        <p id="statusMessage" role="status">Carregando produtos...</p>

        <p id="listErrorMessage" class="error-message" role="alert"></p>

        <div class="table-wrapper">
            <table class="products-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Categoria</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody id="productsTableBody"></tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
